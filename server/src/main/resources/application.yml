server:
  port: 8080

spring:
  application:
    name: bubble-app
  profiles:
    active: local  # Use 'dev' for PostgreSQL, 'local' for H2 in-memory

  datasource:
    url: jdbc:postgresql://localhost:5432/bubbleapp
    username: bubble
    password: bubble_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-please}
  access-token-expiration: 3600000     # 1 hour in milliseconds
  refresh-token-expiration: 2592000000 # 30 days in milliseconds

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:bubbleapp}

push:
  fcm:
    enabled: ${FCM_ENABLED:false}
    server-key: ${FCM_SERVER_KEY:}
  apns:
    enabled: ${APNS_ENABLED:false}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    bundle-id: ${APNS_BUNDLE_ID:org.example.bubbleapp}

logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    org.example.bubbleapp: DEBUG
    org.springframework.web.socket: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
