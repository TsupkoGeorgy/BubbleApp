spring:
  datasource:
    url: jdbc:h2:mem:bubbleapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false  # Use Hibernate auto DDL for H2

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.example.bubbleapp: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: local-dev-secret-key-256-bits-long-for-testing-only-32b
