spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.example.bubbleapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Development JWT secret (do not use in production)
jwt:
  secret: dev-secret-key-256-bits-long-for-testing-purposes-only-32bytes
